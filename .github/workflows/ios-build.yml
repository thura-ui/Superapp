name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Archive iOS App
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath ios/App/build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create Valid IPA Package
        run: |
          cd ios/App/build/App.xcarchive/Products/Applications
          mkdir Payload
          cp -R App.app Payload/
          zip -r App.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-real-device
          path: ios/App/build/App.xcarchive/Products/Applications/App.ipa
