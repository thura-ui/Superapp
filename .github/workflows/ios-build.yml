name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Physical Device (.app)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            echo "Using Xcode workspace: ios/App/App.xcworkspace"
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ios/App/build
          elif [ -d ios/App/App.xcodeproj ]; then
            echo "Using Xcode project: ios/App/App.xcodeproj"
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ios/App/build
          else
            echo "No App.xcworkspace or App.xcodeproj found under ios/App."
            ls -R ios || true
            exit 1
          fi

      - name: Package .app to Unsigned .ipa
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-real-device
          path: ios/App/build/Build/Products/Release-iphoneos/App.ipa
