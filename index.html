<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- 🌟 CSP ပြင်ဆင်ချက် (Vercel Live, FlagCDN, WebSockets နှင့် API ချိတ်ဆက်မှုများကို ခွင့်ပြုထားပါသည်) -->
    <meta 
      http-equiv="Content-Security-Policy" 
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline' https://vercel.live https://*.vercel.live https://*.vercel.com;
        script-src-elem 'self' 'unsafe-eval' 'unsafe-inline' https://vercel.live https://*.vercel.live https://*.vercel.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://vercel.live;
        font-src 'self' data: https://fonts.gstatic.com https://assets.vercel.com;
        img-src 'self' data: blob: https: https://flagcdn.com https://vercel.live https://*.vercel-storage.com;
        connect-src 'self' https: wss: https://vercel.live https://*.vercel.live wss://*.vercel.live;
        frame-src 'self' https://vercel.live;
      "
    />
    
    <!-- 🌟 Favicon Icon -->
    <link rel="icon" type="image/png" href="/Simless-logo.png" />
    <link rel="apple-touch-icon" href="/Simless-logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Simless Travel eSIM</title>

    <!-- Social Media Sharing Images -->
    <meta property="og:image" content="/Simless-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/Simless-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
